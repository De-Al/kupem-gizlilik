<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Küpem ilanı</title>
<meta name="description" content="Küpem'de belge, kimlik ve piyasa fiyatıyla doğrulanmış canlı hayvan ilanı.">
<meta property="og:title" content="Küpem — doğrulanmış canlı hayvan ilanı">
<meta property="og:description" content="Her ilanın 0–100 Güven Skoru var. İlanı görmek için dokunun.">
<meta property="og:type" content="website">
<style>
  :root { --bg: #F5F2EA; --card: #fff; --ink: #14241E; --muted: #5A6A62; --green: #0F6E56; --dark: #0B3B2E; --mint: #7EE8C4; --amber: #E9B44C; --red: #B5452E; --line: #DDD6C6; --sand: #ECE7DA; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0E1F19; --card: #14332A; --ink: #F5F2EA; --muted: #C3D9CF; --line: #23453A; --sand: #1B3A30; } }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  header { background: var(--dark); color: #FBFBF8; padding: 14px 16px; display: flex; justify-content: space-between; align-items: center; }
  header b { font-size: 24px; letter-spacing: -0.5px; } header b span { color: var(--mint); }
  header small { color: #C3D9CF; }
  main { max-width: 640px; margin: 0 auto; padding-bottom: 40px; }
  .galeri { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; background: #000; }
  .galeri img, .galeri video { flex: 0 0 100%; width: 100%; height: 300px; object-fit: cover; scroll-snap-align: start; }
  .galeri video { object-fit: contain; }
  .icerik { padding: 16px; display: grid; gap: 14px; }
  h1 { font-size: 24px; margin: 0; }
  .fiyat { font-size: 26px; font-weight: 800; color: var(--green); }
  .eski { color: var(--muted); text-decoration: line-through; margin-left: 8px; font-size: 16px; }
  .dusus { color: var(--red); font-weight: 700; margin-left: 6px; }
  .alt { color: var(--muted); }
  .kart { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 16px; display: grid; gap: 12px; }
  .skor { display: flex; gap: 16px; align-items: center; }
  .rozet { width: 92px; height: 92px; border-radius: 50%; display: grid; place-items: center; text-align: center; color: #fff; font-weight: 800; flex: 0 0 auto; }
  .rozet b { font-size: 34px; line-height: 1; display: block; } .rozet small { font-size: 11px; font-weight: 600; }
  .bar { height: 8px; background: var(--sand); border-radius: 4px; overflow: hidden; } .bar i { display: block; height: 100%; }
  .satir { display: flex; justify-content: space-between; font-weight: 600; }
  .bolum { color: var(--green); font-weight: 700; font-size: 13px; letter-spacing: 1px; text-transform: uppercase; }
  .uyari { font-size: 13px; color: var(--muted); }
  .cta { background: var(--dark); color: #FBFBF8; border-radius: 16px; padding: 18px; display: grid; gap: 6px; }
  .cta b { font-size: 18px; } .cta span { color: #C3D9CF; font-size: 14px; }
  .bos { padding: 40px 16px; text-align: center; color: var(--muted); }
</style>
</head>
<body>
<header><b>Küp<span>em</span></b><small>Doğruluğundan emin ol, sonra satın al.</small></header>
<main id="ana"><p class="bos">İlan yükleniyor…</p></main>
<script>
  const SUPABASE = 'https://pinbrygqavomohlzkhpg.supabase.co';
  const ANAHTAR = 'sb_publishable_lzrMDgoQynALRZTP18apnQ_GdkqPVbo'; // herkese açık (publishable) anahtar
  const TUR = { sigir: 'Sığır', manda: 'Manda', koyun: 'Koyun', keci: 'Keçi' };
  const tl = (n) => Number(n).toLocaleString('tr-TR') + ' TL';
  const renk = (s) => (s >= 85 ? '#0F6E56' : s >= 60 ? '#E9B44C' : '#B5452E');
  const kac = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const ana = document.getElementById('ana');

  async function yukle() {
    const kod = new URLSearchParams(location.search).get('kod');
    if (!kod) { ana.innerHTML = '<p class="bos">Bağlantıda ilan kodu yok.</p>'; return; }
    const alanlar = 'kod,tur,irk,cinsiyet,yas_ay,kg,il,ilce,fiyat,eski_fiyat,adet,kurbanlik,hisse_toplam,hisse_bos,aciklama,photos,video,score,seller_name,status';
    const r = await fetch(`${SUPABASE}/rest/v1/listings?select=${alanlar}&kod=eq.${encodeURIComponent(kod.trim().toUpperCase())}`, {
      headers: { apikey: ANAHTAR, Authorization: `Bearer ${ANAHTAR}` },
    });
    const [l] = r.ok ? await r.json() : [];
    if (!l) {
      ana.innerHTML = `<p class="bos">Bu kodla yayında bir ilan bulunamadı.<br>İlan satılmış, kaldırılmış ya da incelemede olabilir.<br><br><b>${kac(kod)}</b></p>`;
      return;
    }
    const s = l.score || {};
    const dustu = l.eski_fiyat && Number(l.eski_fiyat) > Number(l.fiyat);
    const baslik = `${l.adet > 1 ? l.adet + ' baş ' : ''}${l.irk} ${l.cinsiyet === 'erkek' ? 'Erkek' : 'Dişi'}`;
    document.title = `${baslik} · ${tl(l.fiyat)} · Küpem`;
    const medya = [...(l.photos || []).map((p) => `<img src="${kac(p)}" alt="Hayvan fotoğrafı" loading="lazy">`),
                   l.video ? `<video src="${kac(l.video)}" controls playsinline preload="metadata"></video>` : ''].join('');
    const bar = (ad, v, a) => `<div><div class="satir"><span>${ad} <small class="alt">${a}</small></span><span>${v}/100</span></div>
      <div class="bar"><i style="width:${v}%;background:${renk(v)}"></i></div></div>`;
    ana.innerHTML = `
      ${medya ? `<div class="galeri">${medya}</div>` : ''}
      <div class="icerik">
        <div>
          <h1>${kac(baslik)}</h1>
          <div><span class="fiyat">${tl(l.fiyat)}</span>${dustu ? `<span class="eski">${tl(l.eski_fiyat)}</span><span class="dusus">↓ %${Math.round((1 - l.fiyat / l.eski_fiyat) * 100)}</span>` : ''}</div>
          <div class="alt">${TUR[l.tur] || ''} · ${l.adet > 1 ? 'ortalama ' : ''}${l.kg} kg · ${l.yas_ay} aylık · ${kac(l.il)}${l.ilce ? ', ' + kac(l.ilce) : ''}</div>
          ${l.adet > 1 ? `<div><b>${l.adet} baş · baş başı ${tl(Math.round(l.fiyat / l.adet))}</b></div>` : ''}
          ${l.kurbanlik ? '<div class="dusus" style="color:var(--green)">🐂 Kurbanlık</div>' : ''}
        </div>
        ${l.hisse_toplam ? `<div class="kart"><div class="bolum">Hisseli kurbanlık</div>
          <div><b>${l.hisse_bos ? l.hisse_bos + ' hisse boş (toplam ' + l.hisse_toplam + ')' : 'Tüm hisseler doldu'}</b></div>
          <div class="fiyat" style="font-size:20px">Hisse fiyatı: ${tl(Math.round(l.fiyat / l.hisse_toplam))}</div></div>` : ''}
        <div class="kart">
          <div class="skor">
            <div class="rozet" style="background:${renk(s.toplam)}"><div><b>${s.toplam ?? '–'}</b><small>Güven Skoru</small></div></div>
            <div><b>Küpem doğrulaması</b><div class="alt">Kod: ${kac(l.kod)}</div><div class="alt">Satıcı: ${kac(l.seller_name) || 'İsimsiz'}</div></div>
          </div>
          ${bar('Belge', s.belge ?? 0, '× 0,40')}${bar('Kimlik', s.kimlik ?? 0, '× 0,35')}${bar('Piyasa', s.piyasa ?? 0, '× 0,25')}
          <div class="uyari">Belgeler kişisel veri içerdiği için gösterilmez. Ödemeyi hayvanı görmeden ve küpe numarasını kontrol etmeden yapmayın.</div>
        </div>
        ${l.aciklama ? `<div class="kart"><div class="bolum">Açıklama</div><div>${kac(l.aciklama)}</div></div>` : ''}
        <div class="cta"><b>Satıcıyla iletişime geçin</b><span>Satıcıyı aramak ve diğer doğrulanmış ilanları görmek için Küpem uygulamasını indirin. Yakında Google Play'de.</span></div>
      </div>`;
  }
  yukle().catch(() => { ana.innerHTML = '<p class="bos">İlan yüklenemedi. İnternet bağlantınızı kontrol edip sayfayı yenileyin.</p>'; });
</script>
</body>
</html>
